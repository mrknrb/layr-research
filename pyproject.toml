[project]
name = "layr-research"
version = "0.1.0"
description = "layr research plugin: load CSV data, describe it, plot it and test it."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
