<!doctype html>
<!-- A page to try editor.js by itself, with made-up completion, hover and values (plugins/dev/research-editor.test.mjs
     drives it). Not one of the plugin's panels: layr.json doesn't list it. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research editor (development page)</title>
    <link rel="stylesheet" href="/_layr/layr.css" />
    <link rel="stylesheet" href="./editor.css" />
    <style>
      body {
        padding: 10px;
        font: 13px/1.4 var(--font);
        overflow: auto;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      .pane {
        height: 380px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .merge {
        height: 300px;
        margin-top: 12px;
      }
      h3 {
        margin: 14px 0 6px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--fg-dim);
      }
      table.tv {
        border-collapse: collapse;
        font: 11px var(--font-mono);
      }
      table.tv th,
      table.tv td {
        border: 1px solid var(--border);
        padding: 1px 6px;
        text-align: right;
      }
      table.tv th {
        background: var(--bg-3);
      }
      #log {
        color: var(--fg-dim);
        font-size: 12px;
      }
      @media (max-width: 520px) {
        .pane {
          height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>editor.js</b>
      <button class="layr-button" id="theme">Light / dark</button>
      <button class="layr-button" id="folds">Fold / unfold the checks</button>
      <span id="log"></span>
    </div>
    <div class="pane" id="ed"></div>
    <h3>Reviewing a draft</h3>
    <div class="merge" id="merge"></div>
    <h3>A snippet</h3>
    <div id="snippet"></div>
    <script type="module">
      import { createEditor, createMerge, highlight } from "./editor.js";

      const SOURCE = `"""Attitude survey: from the answers to a trend per group (a sample for the editor)."""
from toolbox import fit_line, pick_rows, read_table


def relative_to_baseline(answers, baseline="wave_1"):
    """Divide each respondent's score by their score in the baseline wave."""
    if baseline not in set(answers["wave"]):
        raise ValueError(f"no answers of the baseline wave {baseline} in the table")
    base = answers[answers["wave"] == baseline][["respondent", "score"]].rename(columns={"score": "base_score"})
    out = answers.merge(base, on="respondent")
    out["ratio"] = out["score"] / out["base_score"]
    return out


def trends(ratios, waves, group_column="group", time_column="weeks_since_start", keep_outliers=False, weights=None):
    """Fit one straight line per group through the ratios against the weeks since the start."""
    lines = {}
    for name, rows in ratios.groupby("group"):
        line = fit_line(rows["weeks_since_start"], rows["ratio"])
        lines[name] = line
    return lines


def recipe(answers_file, baseline="wave_1", waves=(1, 2, 3, 4)):
    """The method: read, compare, fit."""
    answers = read_table(answers_file)
    ratios = relative_to_baseline(answers, baseline)
    lines = trends(ratios, waves)
    return {"lines": lines, "ratios": ratios}
`;
      const AFTER = SOURCE.replace(
        'out["ratio"] = out["score"] / out["base_score"]',
        'out["ratio"] = out["score"] / out["base_score"]\n    out = out[out["ratio"] > 0]',
      )
        .replace('for name, rows in ratios.groupby("group"):', "for name, rows in ratios.groupby(group_column):")
        .replace(
          '"""The method: read, compare, fit."""',
          '"""The method: read the answers, compare them with the baseline, fit a trend."""',
        );

      const log = (s) => (document.getElementById("log").textContent = s);
      const table = (cols, rows) => {
        const t = document.createElement("table");
        t.className = "tv";
        t.innerHTML =
          "<tr>" +
          cols.map((c) => `<th>${c}</th>`).join("") +
          "</tr>" +
          rows.map((r) => "<tr>" + r.map((x) => `<td>${x}</td>`).join("") + "</tr>").join("");
        return t;
      };
      const NAMES = [
        { label: "answers", kind: "statement", detail: "table · 54 × 6" },
        { label: "pick_rows", kind: "function", detail: "toolbox", doc: "Keep only the rows where a condition holds." },
        { label: "print", kind: "function", detail: "builtin" },
        { label: "relative_to_baseline", kind: "function", detail: "this method" },
        { label: "read_table", kind: "function", detail: "toolbox" },
      ];
      const COLUMNS = ["group", "respondent", "score", "wave"].map((c) => ({
        label: c,
        kind: "column",
        detail: "column",
        boost: 5,
      }));
      const calls = { complete: 0, hover: 0, signature: 0 };
      window.T = { calls };

      const ed = createEditor(document.getElementById("ed"), {
        doc: SOURCE,
        onChange: () => (window.T.changes = (window.T.changes || 0) + 1),
        onSave: () => (window.T.saved = (window.T.saved || 0) + 1),
        onCursor: (c) => (window.T.cursorAt = c),
        onDefinition: (at) => (window.T.definition = at),
        onRename: (at) => (window.T.rename = at),
        complete: async ({ source, line, column }) => {
          calls.complete++;
          const text = source.split("\n")[line - 1].slice(0, column);
          if (/\.\w*$/.test(text) || /\["\w*$/.test(text)) return COLUMNS;
          const word = /\w*$/.exec(text)[0];
          return NAMES.filter((n) => n.label.startsWith(word));
        },
        hover: async ({ source, line, column }) => {
          calls.hover++;
          const text = source.split("\n")[line - 1];
          const word = /\w*$/.exec(text.slice(0, column))[0] + /^\w*/.exec(text.slice(column))[0];
          if (word !== "fit_line") return null;
          const box = document.createElement("div");
          box.className = "hover-test";
          box.append(highlight("def fit_line(x, y, name=None)"), "Fit a straight line y = slope · x + intercept.");
          return box;
        },
        signature: async ({ source, line, column }) => {
          calls.signature++;
          const text = source.split("\n")[line - 1].slice(0, column);
          const m = /fit_line\(([^()]*)$/.exec(text);
          if (!m) return null;
          return {
            label: "fit_line(x, y, name=None)",
            active: m[1].split(",").length - 1,
            doc: "Fit a straight line.",
          };
        },
      });
      window.T.ed = ed;

      // Values, folds, a block and diagnostics, as the plugin would set them after a run.
      window.T.decorate = () => {
        ed.setValues({
          9: [
            {
              name: "base",
              text: "27 × 2",
              type: "table",
              title: "the scores in the baseline wave",
              card: async () =>
                table(
                  ["respondent", "base_score"],
                  [
                    [1, 3.5],
                    [2, 4.17],
                    [3, 2.83],
                  ],
                ),
            },
          ],
          11: [
            {
              name: "out",
              text: "54 × 8",
              type: "table",
              card: () =>
                table(
                  ["group", "score", "ratio"],
                  [
                    ["A", 3.67, 1.048],
                    ["B", 3.17, 0.95],
                  ],
                ),
              onClick: () => (window.T.clicked = (window.T.clicked || 0) + 1),
            },
          ],
          19: [
            {
              name: "line",
              text: "slope 0.0412",
              type: "data",
              card: () => "slope 0.0412, intercept 0.0031, R² 0.9994",
            },
            { name: "name", text: '"A"', type: "none" },
          ],
          26: [{ name: "answers", text: "54 × 6", type: "table", card: () => "54 rows" }],
          28: [{ name: "lines", text: "3 entries", type: "data", card: () => "A, B, C" }],
          29: [{ name: "return", text: "2 results", type: "flags", card: () => "lines, ratios" }],
        });
        ed.setFolds([{ from: 7, to: 8, label: 'stops with a message if baseline not in set(answers["wave"])' }]);
        ed.setDiagnostics([
          { line: 15, level: "warning", message: "This line is longer than 120 characters." },
          { line: 19, level: "error", message: "`fit_line` takes the x values first." },
        ]);
        const below = document.createElement("div");
        below.className = "below-test";
        below.append(
          table(
            ["group", "slope", "R²"],
            [
              ["A", 0.0412, 0.9994],
              ["B", 0.0388, 0.9989],
            ],
          ),
        );
        ed.setBelow({ 28: below });
      };
      window.T.decorate();

      const merge = createMerge(document.getElementById("merge"), {
        before: SOURCE,
        after: AFTER,
        onChange: (c) => (window.T.mergeCounts = c),
      });
      window.T.merge = merge;
      window.T.createMerge = createMerge;
      window.T.highlight = highlight;
      window.T.AFTER = AFTER;
      document
        .getElementById("snippet")
        .append(highlight(SOURCE.split("\n").slice(4, 12).join("\n"), { lineNumbers: true, firstLine: 5 }));

      document.getElementById("theme").onclick = () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
      };
      document.getElementById("folds").onclick = () => log(ed.toggleFolds() ? "checks unfolded" : "checks folded");
      window.T.ready = true;
    </script>
  </body>
</html>
